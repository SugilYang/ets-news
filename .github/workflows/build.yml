name: 지면 자동 빌드(안전망)

# data/·watchlist·생성기가 바뀌어 푸시되면 JSON을 검증하고 지면을 다시 생성해 커밋합니다.
on:
  push:
    branches: [ main ]
    paths:
      - "data/**"
      - "render.py"
      - "scripts/brieflib.py"
      - "watchlist.yml"
      - "assets/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install pyyaml

      - name: JSON 유효성 검사
        run: |
          set -e
          for f in data/*.json; do
            python3 - "$f" <<'PY'
import json, sys
p = sys.argv[1]
d = json.load(open(p, encoding="utf-8"))
assert d.get("schema") == 4 and d.get("date") and d.get("sections"), f"{p}: v4 스키마 아님(date/sections)"
n = sum(len(g.get("items", [])) for s in d["sections"] for g in s.get("groups", []))
assert n >= 1, f"{p}: 아이템 없음"
print(f"OK {p}: 제{d.get('issue_no',0)}호 {len(d['sections'])}섹션 {n}건")
PY
          done

      - name: 지면 생성
        run: python3 render.py

      - name: 산출물 커밋
        run: |
          git config user.name "ETS News Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html archive.html search.html search-index.json weekly.html briefings companies weekly
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "자동 빌드: 지면 재생성 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
