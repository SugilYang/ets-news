name: 매일 뉴스 자동 발행

# 매일 아침 08:00 KST 자동 실행 + 필요 시 수동 실행
on:
  schedule:
    # GitHub Actions cron은 UTC 기준. 08:00 KST = 23:00 UTC (전날)
    - cron: "0 23 * * *"
  workflow_dispatch: {}   # Actions 탭에서 '수동 실행' 가능

# 생성물을 저장소에 커밋하기 위한 권한
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 뉴스 수집 및 지면 생성
        run: python scripts/fetch_news.py

      - name: 생성물 커밋
        run: |
          git config user.name "ETS News Bot"
          git config user.email "actions@github.com"
          # 신문 지면을 사이트 루트에도 배치(GitHub Pages가 이 파일을 서비스)
          cp public/index.html index.html
          touch .nojekyll public/.nojekyll
          git add public index.html .nojekyll public/.nojekyll
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "자동 발행: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
