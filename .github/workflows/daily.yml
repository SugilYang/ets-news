name: 영업 브리핑 자동 발행 (월~금)

# 월~금 08:00 KST(=일~목 23:00 UTC) GitHub 서버가 혼자 실행합니다. 무료·무인·API 키 없음.
# 주말·공휴일(watchlist.yml schedule.holidays)은 collect.py 가 스스로 건너뜁니다.
#
# ★ 자동 실행 일시 중지 상태 (최종 확정 전). 다시 켜려면 아래 schedule 2줄의 # 만 지우면 됩니다.
#   지금은 Actions 탭 → "영업 브리핑 자동 발행" → Run workflow 로만 수동 실행됩니다.
on:
  # schedule:
  #   - cron: "0 23 * * 0-4"
  workflow_dispatch: {}
  push:                      # watchlist.yml 이나 이 파일을 고쳐 올리면 그 즉시 1회 실행(오늘 호가 이미 있으면 아무것도 안 함)
    branches: [ main ]
    paths:
      - "watchlist.yml"
      - ".github/workflows/daily.yml"

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 뉴스 수집·분류·등급 → data/<오늘>.json + db/topics.json (로그 저장)
        id: collect
        continue-on-error: true
        run: |
          mkdir -p logs
          set -o pipefail
          { echo "=== $(TZ=Asia/Seoul date '+%F %T KST') 실행 ==="; python3 scripts/collect.py; } 2>&1 | tee logs/last-run.txt

      - name: 지면 생성
        if: steps.collect.outcome == 'success'
        run: python3 render.py

      - name: 커밋·푸시 (실행 로그 포함)
        if: always()
        run: |
          echo "결과: ${{ steps.collect.outcome }}" >> logs/last-run.txt
          git config user.name "ETS News Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "자동 발행: $(TZ=Asia/Seoul date +%F) (${{ steps.collect.outcome }})"
            for i in 1 2 3 4; do
              git push && break
              git pull --rebase origin main && sleep $((2**i))
            done
          fi
