name: 시장 동향 수집 (월~금)

# 월~금 06:50 KST(=일~목 21:50 UTC) GitHub 서버가 혼자 실행합니다. (GitHub 예약은 30~60분 늦게 돌 때가 있어 07:40 정제보다 넉넉히 앞당김) 무료·무인·API 키 없음.
#   1) 뉴스 수집·분류 → data/<오늘>.json (규칙표 판) + db/candidates-<오늘>.json (후보 목록)
#   2) 지면 생성·푸시 → 07:30쯤 규칙표 판이 먼저 올라감
#   3) 07:40 KST Claude 예약(Max)이 후보를 읽고 정제한 판으로 덮어씀 (Claude가 실패하면 규칙표 판이 그대로 남음)
# 주말·공휴일(watchlist.yml schedule.holidays)은 collect.py 가 스스로 건너뜁니다.
# 멈추려면 아래 schedule 두 줄 앞에 # 을 붙이세요.
on:
  schedule:
    - cron: "50 21 * * 0-4"
  workflow_dispatch: {}
  push:                      # watchlist.yml 이나 이 파일을 고쳐 올리면 그 즉시 1회 실행(오늘 호가 이미 있으면 아무것도 안 함)
    branches: [ main ]
    paths:
      - "watchlist.yml"
      - ".github/workflows/daily.yml"

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 뉴스 수집·분류·등급 → data/<오늘>.json + db/candidates (로그 저장)
        id: collect
        continue-on-error: true
        run: |
          mkdir -p logs
          set -o pipefail
          { echo "=== $(TZ=Asia/Seoul date '+%F %T KST') 실행 ==="; python3 scripts/collect.py; } 2>&1 | tee logs/last-run.txt

      - name: 지면 생성
        if: steps.collect.outcome == 'success'
        run: python3 render.py

      - name: 커밋·푸시 (실행 로그 포함)
        if: always()
        run: |
          echo "결과: ${{ steps.collect.outcome }}" >> logs/last-run.txt
          git config user.name "ETS News Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "자동 수집: $(TZ=Asia/Seoul date +%F) (${{ steps.collect.outcome }})"
            for i in 1 2 3 4; do
              git push && break
              git pull --rebase origin main && sleep $((2**i))
            done
          fi
