name: 매일 아침 브리핑 자동 생성

# 매일 08:00 KST(=23:00 UTC 전날) GitHub 서버가 혼자 실행합니다. 무료·무인·API 키 없음.
#
# ★ 자동 실행 일시 중지 상태 (최종 확정 전). 다시 켜려면 아래 schedule 2줄의 # 만 지우면 됩니다.
#   지금은 Actions 탭 → "매일 아침 브리핑 자동 생성" → Run workflow 로만 수동 실행됩니다.
on:
  # schedule:
  #   - cron: "0 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 뉴스 수집·원문 리드 추출 → data/<오늘>.json (로그 저장)
        id: collect
        continue-on-error: true
        run: |
          mkdir -p logs
          set -o pipefail
          { echo "=== $(TZ=Asia/Seoul date '+%F %T KST') 실행 ==="; python3 scripts/collect.py; } 2>&1 | tee logs/last-run.txt

      - name: 지면 생성
        if: steps.collect.outcome == 'success'
        run: python3 render.py

      - name: 커밋·푸시 (실행 로그 포함)
        if: always()
        run: |
          echo "결과: ${{ steps.collect.outcome }}" >> logs/last-run.txt
          git config user.name "ETS News Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "자동 발행: $(TZ=Asia/Seoul date +%F) (${{ steps.collect.outcome }})"
            for i in 1 2 3 4; do
              git push && break
              git pull --rebase origin main && sleep $((2**i))
            done
          fi
