name: 매일 아침 브리핑 자동 생성

# 매일 08:00 KST(=23:00 UTC 전날)에 GitHub 서버가 혼자 실행합니다. 사람 개입 없음.
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch: {}     # Actions 탭에서 '지금 실행'도 가능

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 조사·정제 → data/<오늘>.json 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIEF_MODEL: ${{ vars.BRIEF_MODEL || 'claude-opus-5' }}
          BRIEF_MAX_SEARCHES: ${{ vars.BRIEF_MAX_SEARCHES || '24' }}
        run: python3 scripts/generate.py

      - name: 지면 생성
        run: python3 render.py

      - name: 커밋·푸시
        run: |
          git config user.name "ETS News Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data index.html archive.html search.html search-index.json weekly.html briefings companies
          if git diff --staged --quiet; then
            echo "변경 없음(이미 생성됨)"
          else
            git commit -m "자동 발행: $(TZ=Asia/Seoul date +%F)"
            for i in 1 2 3 4; do
              git push && break
              git pull --rebase origin main && sleep $((2**i))
            done
          fi
