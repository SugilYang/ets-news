# ══════════════════════════════════════════════════════════════════
#  이티에스 영업 브리핑 — 감시 대상·규칙 설정 (v3)
#
#  근거: 「일일·주간 시장동향 정보보고 체계 구축」(PPT) + Market Intelligence V5(엑셀)
#  매일 아침 이 파일 하나를 기준으로 뉴스를 찾고 → 카테고리로 나누고 → 등급을 찍습니다.
#
#  코드 몰라도 됩니다. 규칙 3가지:
#    · 넣기      : 줄을 추가
#    · 빼기      : 줄을 지우거나 앞에 # 을 붙여 주석 처리
#    · 잠시 끄기 : enabled: false
#  저장하면 다음 발행부터 반영됩니다.
# ══════════════════════════════════════════════════════════════════

site:
  name: "이티에스 시장 동향"
  name_en: "ETS MARKET INTELLIGENCE"
  edition: "조간"
  first_issue_date: ""                  # 제1호 날짜(호수 계산 기준). 비워 두면 첫 발행일이 자동으로 제1호

# ── 발행 일정 ──────────────────────────────────────────────────────
schedule:
  weekdays_only: true                    # 월~금만 발행 (토·일은 건너뜀)
  window_hours: 36                       # 화~금: 최근 36시간 기사
  window_hours_monday: 84                # 월요일: 금요일 저녁 이후(주말 포함) 84시간
  holidays:                              # 이 날짜는 발행하지 않음 (YYYY-MM-DD)
    - "2026-09-24"   # 추석 연휴
    - "2026-09-25"
    - "2026-10-03"   # 개천절
    - "2026-10-09"   # 한글날
    - "2026-12-25"   # 성탄절
    - "2027-01-01"   # 신정

# ── 작성 원칙 ──────────────────────────────────────────────────────
rules:
  style: "사실만. 주체·수치·날짜·출처. 판단·시사점·전망 문장은 쓰지 않음."
  brief_sentences: 1                     # 항목당 본문 문장 수. 핵심 한 문장만, 나머지는 원문 링크로.
  brief_max_chars: 90
  items_per_section_max: 8               # 면당 최대 건수
  items_per_group_max: 3                 # 소제목(LG엔솔·전기차 등)당 최대 건수
  items_per_company_max: 2               # 한 면에서 같은 회사 기사는 최대 2건
  topic_memory_days: 30                  # 한 번 실은 사안은 30일간 기억, 바뀐 것만 '후속'으로 재게재
  followup_needs_change: true            # 수치·일정이 달라져야만 후속으로 실음
  min_items_to_publish: 2                # 이보다 적으면 그날 호를 만들지 않음

# ── 출처 신뢰도 (PPT 기준 ★) ─ 도메인으로 자동 판정 ───────────────────
reliability:
  5: ["dart.fss.or.kr", "sec.gov", "lgensol.com", "samsungsdi.co.kr", "samsungsdi.com", "sk-on.com", "skinnonews.com",
      "catl.com", "byd.com", "panasonic.com", "irgo.co.kr"]
  4: ["yna.co.kr", "hankyung.com", "mk.co.kr", "sedaily.com", "edaily.co.kr", "mt.co.kr", "fnnews.com", "newspim.com",
      "etnews.com", "thelec.kr", "thelec.net", "ddaily.co.kr", "reuters.com", "bloomberg.com", "ft.com", "wsj.com", "nikkei.com",
      "motie.go.kr", "moel.go.kr", "korea.kr", "me.go.kr", "energy.gov", "ec.europa.eu",
      "kbs.co.kr", "mbc.co.kr", "sbs.co.kr", "chosun.com", "joongang.co.kr", "donga.com", "hani.co.kr", "khan.co.kr",
      "news1.kr", "newsis.com", "asiae.co.kr", "ajunews.com", "biz.heraldcorp.com", "heraldcorp.com", "businesspost.co.kr"]
  3: ["industrynews.co.kr", "batterynews.co.kr", "hellot.net", "electrive.com", "batteriesnews.com", "energy-storage.news",
      "cnevpost.com", "carnewschina.com", "electrek.co", "insideevs.com", "batterytech.kr", "kipris.or.kr", "patents.google.com",
      "jobkorea.co.kr", "saramin.co.kr", "linkedin.com", "kita.net", "kbia.or.kr", "semi.org"]
  # 그 외 도메인은 ★2

# ── 중요도 (PPT 기준 A/B/C) ─ 제목·본문 키워드로 자동 판정 ─────────────
importance:
  A:   # 즉시보고: 대규모 투자, RFQ, 투자취소/연기, 경쟁사 대형수주
    any: ["RFQ", "입찰", "장비 발주", "장비발주", "공급사 선정", "공급업체 선정", "벤더 선정", "우선협상",
          "투자 취소", "투자취소", "투자 연기", "투자연기", "투자 중단", "가동 중단", "공장 폐쇄", "철수", "감산",
          "신공장", "신규 공장", "기가팩토리", "gigafactory", "착공", "장비 반입", "장비반입", "양산 개시", "SOP",
          "tender", "equipment order", "cancel", "delay", "suspend", "plant closure", "groundbreaking"]
    money_with: ["수주", "공급계약", "공급 계약", "투자", "증설", "계약 체결", "order", "contract", "investment", "expansion"]
    money_min_krw_100m: 500              # 위 단어 + 500억원(0.5조) 이상 금액이 같이 나오면 A
  B:   # Daily: 고객 실적·투자 진행, 주요 산업 변화
    any: ["수주", "공급계약", "공급 계약", "투자", "증설", "실적", "영업이익", "매출", "합작", "JV", "MOU", "양산", "가동",
          "ESS", "전고체", "LFP", "46시리즈", "46계열", "각형", "파우치", "원통형", "보조금", "세액공제", "관세", "IRA", "AMPC",
          "채용", "해외법인", "특허", "인증", "벤더 등록", "order", "capacity", "subsidy", "tariff", "patent"]
  # 그 외는 C (Weekly·일반)

# ── 제외어 ─ 어느 면이든 싣지 않음(정치·부동산·연예 등) ──
exclude_all: ["청문회", "후보자", "인사청문", "부동산", "집값", "아파트", "국회의원", "대선", "총선", "검찰", "재판", "콘서트", "아이돌", "드라마",
              "ETF", "상장지수", "펀드 수익률", "종목코드", "주식 추천"]
# ── 시장·기술/정책 면에서만 제외(고객사·경쟁사 면에는 그대로 실림) ─ 증권 시황·목표가류 ──
exclude_market: ["목표가", "주가", "급락", "급등", "수익률", "증권 리포트", "종목", "코스피", "코스닥", "주주환원", "배당", "시가총액", "투자의견"]
# ── 제목에 아래 단어가 있으면 어느 면이든 제외 ─ 주식·증권 기사(산업 동향이 아님) ──
exclude_title: ["목표가", "목표주가", "투자의견", "리포트", "주가", "급락", "급등", "ETF", "수익률", "주주환원", "배당", "시가총액", "코스피", "코스닥",
                "종목", "월가", "증시", "매수", "매도", "e종목", "특징주", "관련주", "테마주", "공매도", "조기 지급", "조기지급", "협력사 대금",
                "증권사", "추정치", "강세", "약세", "와우넷", "마켓", "NDR", "밸류체인 '핵심", "상한가", "하한가", "신고가",
                "리레이팅", "밸류에이션", "애널리스트", "투자證", "證 ", "證\"", "證“", "리서치센터", "실적 전망치", "컨센서스"]
# ── 이름이 겹치는 다른 회사 ─ 이 글자가 있으면 그 부분은 회사명 판정에서 뺌 ──
entity_not: ["SFA반도체", "SFA 반도체", "에스에프에이반도체", "SFA Semiconductor"]

# ── 영업 길잡이 규칙 ─ 항목의 카테고리·태그·등급이 맞으면 아래 문구가 '오늘의 영업 포인트'에 자동으로 실림 ──
#   {entity} 자리에 회사명이 들어갑니다. 판단이 아니라 PPT의 '정보 → 영업기회 → Action' 연결표를 그대로 옮긴 것입니다.
sales_guide:
  - {cats: [project], tags_any: [RFQ], grades: [A, B], say: "{entity} 입찰·발주 신호 → 장비 사양·일정 확인, 견적 준비"}
  - {cats: [customer, project], tags_any: [투자], grades: [A, B], say: "{entity} 신·증설 투자 → 라인 구성·장비 발주(RFQ) 시점 확인"}
  - {cats: [customer, project], tags_any: [ESS], grades: [A, B], say: "{entity} ESS 물량 확대 → ESS 셀 라인 증설 여부·주액/조립 장비 수요 확인"}
  - {cats: [customer, project], tags_any: [리스크], grades: [A, B, C], say: "{entity} 연기·취소 신호 → 진행 중 견적·납기 재확인"}
  - {cats: [customer, project], tags_any: [각형, 46시리즈, 전고체], grades: [A, B], say: "{entity} 신규 폼팩터(각형·46·전고체) → 신규 라인 장비 수요 가능성 점검"}
  - {cats: [competitor], tags_any: [수주], grades: [A, B], say: "경쟁사 {entity} 수주 → 해당 고객·라인 경쟁 구도 확인, 당사 레퍼런스 정리"}
  - {cats: [competitor], tags_any: [채용, 특허], grades: [A, B, C], say: "경쟁사 {entity} 채용·특허 → 신규 프로젝트 선행 신호, 동향 추적"}
  - {cats: [customer, project, competitor, market, tech_policy], tags_any: [주액], grades: [A, B, C], say: "주액 관련 보도({entity}) → 당사 핵심 장비 직접 관련, 우선 확인"}
  - {cats: [tech_policy], tags_any: [정책], grades: [A, B], say: "정책·보조금 변화 → 고객 투자 지역·일정 영향 확인"}

# ── 산업 앵커 ─ 시장·기술/정책 기사는 아래 단어 중 하나는 있어야 실림(무관한 정책·경제 기사 차단) ──
anchors: ["배터리", "이차전지", "2차전지", "전기차", "ESS", "에너지저장", "전고체", "양극재", "음극재", "전해액", "전해질", "리튬", "분리막",
          "반도체", "HBM", "파운드리", "AMR", "AGV", "로봇", "스마트팩토리", "공장자동화", "물류자동화", "물류 자동화", "무인지게차", "장비",
          "battery", "EV", "electric vehicle", "gigafactory", "semiconductor", "robot", "automation", "electrolyte"]

# ── 카테고리 (PPT ①~⑤) ─ 지면 순서 ─────────────────────────────────
#  매 항목은 아래 순서로 판정됩니다: 경쟁사 이름 → 고객사 이름(+Project 신호) → 기술/정책 → 시장/산업
categories:
  - id: project
    title: "Project · RFQ"
    subtitle: "투자지역·규모·일정 · RFQ/발주 신호"
    order: 1
    enabled: true
    signals: ["RFQ", "입찰", "장비 발주", "장비발주", "공급사 선정", "공급업체 선정", "벤더", "우선협상", "착공", "장비 반입", "장비반입",
              "SOP", "양산 개시", "준공", "환경허가", "건축허가", "tender", "equipment order", "vendor selection", "groundbreaking", "move-in", "permit"]

  - id: customer
    title: "고객사 동향"
    subtitle: "CAPEX · 신공장 · 증설 · JV · 연기/취소"
    order: 2
    enabled: true
    groups:                              # 지면 소제목 (순서대로)
      - {id: lgensol, title: "LG에너지솔루션", companies: ["LG에너지솔루션"]}
      - {id: sdi, title: "삼성SDI", companies: ["삼성SDI"]}
      - {id: skon, title: "SK온", companies: ["SK온"]}
      - {id: global, title: "글로벌 · 기타", companies: ["CATL", "BYD", "Panasonic Energy", "Northvolt", "ACC", "PowerCo", "Envision AESC",
                                                        "Tata Agratas", "Prime Planet", "Freyr", "Ultium Cells", "StarPlus", "NextStar", "Blue Oval SK", "EVE", "CALB", "Gotion", "SVOLT", "AESC"]}

  - id: competitor
    title: "업계 동향"
    subtitle: "경쟁사 수주 · 신규장비 · 기술 · 해외진출"
    order: 3
    enabled: true

  - id: tech_policy
    title: "기술 · 정책"
    subtitle: "특허 · 공정변화 · 보조금 · 국가별 정책"
    order: 4
    enabled: true
    signals: ["보조금", "세액공제", "관세", "IRA", "AMPC", "FEOC", "현지화", "법안", "시행령", "규제", "인허가", "고용노동부", "산업통상자원부", "산업부",
              "특허", "전고체", "건식전극", "실리콘 음극", "나트륨", "리튬메탈", "신공정", "subsidy", "tax credit", "tariff", "regulation", "solid-state", "dry electrode", "patent"]

  - id: market
    title: "시장 · 산업"
    subtitle: "시장규모 · 수요전망 · 기술 Trend"
    order: 5
    enabled: true
    groups:
      - {id: ev, title: "전기차", keywords: ["전기차", "EV", "전기차 판매", "전기차 보조금", "EV sales", "전기차 수요", "테슬라", "Tesla", "현대차 전기차"]}
      - {id: battery, title: "이차전지", keywords: ["이차전지", "배터리", "K-배터리", "battery", "ESS", "LFP", "리튬", "양극재", "음극재", "분리막", "전해액", "전해질"]}
      - {id: semi, title: "반도체", keywords: ["반도체", "HBM", "파운드리", "fab", "팹", "웨이퍼", "2나노", "첨단패키징"]}
      - {id: fa, title: "스마트팩토리 · AMR", keywords: ["AMR", "AGV", "자율주행로봇", "물류로봇", "물류자동화", "스마트팩토리", "공장자동화", "무인지게차", "피지컬 AI", "휴머노이드", "digital twin", "MES"]}

