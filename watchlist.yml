# ══════════════════════════════════════════════════════════════════
#  이티에스 산업 브리핑 — 감시 대상 설정 (v2)
#
#  매일 아침 이 파일을 기준으로 뉴스를 조사·정제해 브리핑을 만듭니다.
#  코드 몰라도 됩니다. 규칙 3가지:
#    · 넣기  : 줄을 추가
#    · 빼기  : 줄을 지우거나 앞에 #을 붙여 주석 처리
#    · 잠시 끄기 : enabled: false
#  저장하면 다음 아침 브리핑부터 반영됩니다.
# ══════════════════════════════════════════════════════════════════

company:
  name: "ETS (이티에스)"
  products: ["전해액 주액 설비", "이차전지 조립 관련 장비", "AMR(자율주행로봇)"]

# ── 작성 원칙 (자동 생성 세션이 따르는 규칙) ────────────────────────
rules:
  style: "사실(팩트) 중심. 무슨 일이 있었는지, 수치·날짜·출처를 반드시 포함. 주관적 판단·영업 시사점·우선순위·고객/경쟁사 라벨 금지. 확인 안 된 수치는 쓰지 않음."
  item_length: "아이템당 3~5문장(배경→핵심 수치→후속 일정). 제목은 핵심 수치/사실을 담아 25자 내외."
  items_per_section: {min: 3, max: 8}
  freshness: "최근 1~2일 우선, 없으면 최근 1주. 기사 보도일을 date 필드에 기록."
  dedupe: "최근 7일치 data/*.json 과 제목·URL이 겹치는 기사는 제외(새 소식만). 같은 사안의 후속 보도는 '후속:' 접두어로 1건만."
  sources_kr: ["디일렉", "전자신문", "머니투데이", "한국경제", "매일경제", "뉴스핌", "이데일리", "연합뉴스", "배터리인사이드", "배터리투데이", "인더스트리뉴스", "헬로티", "고용노동부"]
  sources_en: ["Reuters", "Bloomberg", "Electrive", "Battery-News.de", "Benchmark Mineral Intelligence", "BloombergNEF", "The Elec(EN)"]
  link: "가능하면 원문 URL을 url 필드에 기록(클릭 시 기사로 이동)."

